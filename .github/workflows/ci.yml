name: MacRightClick CI/CD Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit, Script And Cask Tests
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Show toolchain
        run: |
          xcrun --show-sdk-path
          swift --version

      - name: Run Swift tests
        run: swift test

      - name: Validate scripts and Cask structure
        run: |
          bash -n Scripts/*.sh
          bash Tests/CaskStructureTests.sh
          CASK_VERIFY_DOWNLOAD=0 ./Scripts/validate_cask.sh
          python3 -m py_compile Scripts/stress/run_stress.py Scripts/stress/run_reclaim_stress.py

  build:
    name: Build Development Universal 2 Artifacts
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build development artifacts
        run: ./Scripts/build.sh

      - name: Verify development artifacts
        run: |
          codesign --verify --deep --strict --verbose=2 build/RightClickAssistant.app
          hdiutil verify build/RightClickAssistant.dmg

      - name: Upload development artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MacRightClick-Universal2-development
          path: |
            build/RightClickAssistant.zip
            build/RightClickAssistant.dmg
          retention-days: 14

  release:
    name: Signed And Notarized Tag Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-latest
    needs: test
    permissions:
      contents: write
    env:
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Require signing and notarization credentials
        run: |
          for name in DEVELOPER_ID_APPLICATION BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required release secret: $name" >&2
              exit 2
            fi
          done

      - name: Validate tag and version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: ./Scripts/verify_release_metadata.sh

      - name: Import Developer ID certificate
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build signed and notarized release
        env:
          DISTRIBUTION_ROUTE: website-release
        run: ./Scripts/build.sh

      - name: Verify signatures, tickets and metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          ./Scripts/verify_release_metadata.sh
          codesign --verify --deep --strict --verbose=2 build/RightClickAssistant.app
          spctl --assess --type execute --verbose=2 build/RightClickAssistant.app
          xcrun stapler validate build/RightClickAssistant.app
          xcrun stapler validate build/RightClickAssistant.dmg
          hdiutil verify build/RightClickAssistant.dmg

      - name: Prepare immutable and latest release assets
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          cp build/RightClickAssistant.zip "build/RightClickAssistant-v${VERSION}-macOS-Universal.zip"
          cp build/RightClickAssistant.dmg "build/RightClickAssistant-v${VERSION}-macOS-Universal.dmg"
          cp build/RightClickAssistant.zip build/RightClickAssistant-Latest.zip
          cp build/RightClickAssistant.dmg build/RightClickAssistant-Latest.dmg
          cd build
          shasum -a 256 \
            "RightClickAssistant-v${VERSION}-macOS-Universal.zip" \
            "RightClickAssistant-v${VERSION}-macOS-Universal.dmg" \
            RightClickAssistant-Latest.zip \
            RightClickAssistant-Latest.dmg > SHA256SUMS

      - name: Upload signed workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MacRightClick-${{ github.ref_name }}-signed
          path: |
            build/RightClickAssistant-v*-macOS-Universal.zip
            build/RightClickAssistant-v*-macOS-Universal.dmg
            build/RightClickAssistant-Latest.zip
            build/RightClickAssistant-Latest.dmg
            build/SHA256SUMS
          retention-days: 30

      - name: Publish GitHub release
        run: |
          ASSETS=(
            build/RightClickAssistant-v*-macOS-Universal.zip
            build/RightClickAssistant-v*-macOS-Universal.dmg
            build/RightClickAssistant-Latest.zip
            build/RightClickAssistant-Latest.dmg
            build/SHA256SUMS
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi

      - name: Remove temporary signing keychain
        if: ${{ always() }}
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
